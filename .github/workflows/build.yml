# Exercise both MO2 targets on repository changes and weekly to detect upstream drift.
name: Build XnGine

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

# Supersede stale runs for a branch while preserving both matrix targets.
concurrency:
  group: xngine-build-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} build
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [retail, dev]

    # The same build job is run twice so a green retail build cannot hide
    # incompatibilities with development uibase, or the reverse.
    steps:
      - name: Checkout XnGine
        uses: actions/checkout@v4

      # Export the full VS developer environment to subsequent PowerShell steps.
      # Merely finding cl.exe on PATH does not configure its SDK/library paths.
      - name: Enable MSVC toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found on the Windows runner."
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "A Visual Studio installation with the MSVC C++ toolchain was not found."
          }

          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat was not found at $devCmd."
          }

          $environment = & cmd.exe /d /s /c "`"$devCmd`" -arch=amd64 -host_arch=amd64 >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE."
          }

          # GITHUB_ENV persists these values for later steps; this process alone
          # would not modify the environment of a subsequent workflow step.
          foreach ($line in $environment) {
            if ($line -match '^([^=][^=]*)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

          "CC=cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The resolver selects release assets or moving development refs, then
      # emits Qt/toolset requirements and source-revision metadata.
      - name: Resolve MO2 target
        id: mo2
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./ci/resolve-mo2-target.ps1 -Target "${{ matrix.target }}"

      # Use the upstream mob.ini Qt version and compiler architecture; the
      # DLLs must be compiled against a compatible MO2/Qt toolchain.
      - name: Install matching Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.mo2.outputs.qt_version }}
          arch: ${{ steps.mo2.outputs.qt_arch }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          cache: true

      - name: Configure runner vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "GitHub runner did not expose VCPKG_INSTALLATION_ROOT."
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Cache package installation by manifest; vcpkg still resolves packages
      # using the current runner toolchain during CMake configuration.
      - name: Restore XnGine vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: xngine-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      # This checkout uses the resolved ref instead of its recorded SHA.
      # A moving ref could advance between resolution and checkout.
      - name: Checkout matching MO2 source
        uses: actions/checkout@v4
        with:
          repository: ModOrganizer2/modorganizer
          ref: ${{ steps.mo2.outputs.mo2_ref }}
          path: dependencies/modorganizer
          fetch-depth: 1

      # Retail uses the SDK published with its MO2 release, not moving dev sources.
      - name: Download retail uibase SDK
        if: matrix.target == 'retail'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dependencies/uibase-sdk | Out-Null
          Invoke-WebRequest -Uri "${{ steps.mo2.outputs.uibase_asset_url }}" -OutFile dependencies/uibase.7z
          & 7z x dependencies/uibase.7z -odependencies/uibase-sdk -y
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the retail uibase SDK."
          }

          $lib = Get-ChildItem dependencies/uibase-sdk -Recurse -Filter uibase.lib | Select-Object -First 1
          if (-not $lib) {
            throw "The MO2 retail uibase SDK did not contain uibase.lib."
          }

          $header = Get-ChildItem dependencies/uibase-sdk -Recurse -Filter iplugingame.h | Select-Object -First 1
          if (-not $header) {
            throw "The MO2 retail uibase SDK did not contain iplugingame.h."
          }

          # Retail SDK archives can contain an include/uibase hierarchy or
          # expose public headers directly; derive the CMake include root.
          $headerDir = $header.Directory.FullName
          $parent = Split-Path $headerDir -Parent
          if ((Split-Path $headerDir -Leaf) -eq "uibase" -and (Split-Path $parent -Leaf) -eq "include") {
            $uibasePath = Split-Path $parent -Parent
          }
          else {
            $uibasePath = $headerDir
          }

          "XNGINE_UIBASE_PATH=$uibasePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XNGINE_UIBASE_LIB=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Development uses the upstream source rather than the retail SDK.
      # The build below installs its public headers and import library.
      - name: Checkout current dev uibase
        if: matrix.target == 'dev'
        uses: actions/checkout@v4
        with:
          repository: ModOrganizer2/modorganizer-uibase
          ref: ${{ steps.mo2.outputs.uibase_ref }}
          path: dependencies/uibase
          fetch-depth: 1

      - name: Checkout MO2 CMake common
        if: matrix.target == 'dev'
        uses: actions/checkout@v4
        with:
          repository: ModOrganizer2/cmake_common
          ref: ${{ steps.mo2.outputs.cmake_common_sha }}
          path: dependencies/cmake_common
          fetch-depth: 1

      # Invalidate installed headers and libraries when uibase, shared CMake, or Qt changes.
      - name: Restore dev uibase install cache
        if: matrix.target == 'dev'
        id: dev-uibase-cache
        uses: actions/cache@v4
        with:
          path: install
          key: xngine-uibase-${{ runner.os }}-${{ steps.mo2.outputs.uibase_sha }}-${{ steps.mo2.outputs.cmake_common_sha }}-qt-${{ steps.mo2.outputs.qt_version }}

      # A cache hit skips only building the SDK; the next step still verifies
      # that the headers and library are actually available.
      - name: Build current dev uibase
        if: matrix.target == 'dev' && steps.dev-uibase-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./ci/build-dev-uibase.ps1 `
            -SourcePath "$env:GITHUB_WORKSPACE\dependencies\uibase" `
            -InstallPath "$env:GITHUB_WORKSPACE\install" `
            -QtRoot "$env:QT_ROOT_DIR" `
            -CmakeCommonPath "$env:GITHUB_WORKSPACE\dependencies\cmake_common"

      - name: Locate dev uibase SDK
        if: matrix.target == 'dev'
        shell: pwsh
        run: |
          $lib = Get-ChildItem install -Recurse -Filter uibase.lib | Select-Object -First 1
          if (-not $lib) {
            throw "The dev uibase build did not produce uibase.lib."
          }
          if (-not (Test-Path install/include/uibase/iplugingame.h)) {
            throw "The dev uibase build did not install the public uibase headers."
          }

          "XNGINE_UIBASE_PATH=$env:GITHUB_WORKSPACE\install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XNGINE_UIBASE_LIB=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Both targets use the same plugin build script, which asserts that all
      # four game-plugin DLLs exist before artifacts can be uploaded.
      - name: Build XnGine
        shell: pwsh
        run: |
          Write-Host "Compiler selected by PATH:"
          where.exe cl
          cl 2>&1 | Select-Object -First 3

          ./ci/build-xngine.ps1 `
            -Target "${{ matrix.target }}" `
            -UibasePath "$env:XNGINE_UIBASE_PATH" `
            -UibaseLib "$env:XNGINE_UIBASE_LIB" `
            -Mo2SourcePath "$env:GITHUB_WORKSPACE\dependencies\modorganizer" `
            -QtRoot "$env:QT_ROOT_DIR" `
            -BuildDir "build-${{ matrix.target }}" `
            -ArtifactDir "artifacts/${{ matrix.target }}"

      # Record upstream revisions: a retail/dev label alone is not reproducible.
      - name: Record dependency provenance
        shell: pwsh
        run: |
          $lines = @(
            "XnGine commit: $env:GITHUB_SHA",
            "Target: ${{ matrix.target }}",
            "MO2 ref: ${{ steps.mo2.outputs.mo2_ref }}",
            "MO2 commit: ${{ steps.mo2.outputs.mo2_sha }}",
            "uibase ref: ${{ steps.mo2.outputs.uibase_ref }}",
            "uibase commit: ${{ steps.mo2.outputs.uibase_sha }}",
            "cmake_common commit: ${{ steps.mo2.outputs.cmake_common_sha }}",
            "mob ref: ${{ steps.mo2.outputs.mob_ref }}",
            "mob commit: ${{ steps.mo2.outputs.mob_sha }}",
            "Qt: ${{ steps.mo2.outputs.qt_version }}",
            "Qt architecture: ${{ steps.mo2.outputs.qt_arch }}",
            "Compiler: MSVC x64"
          )
          $lines | Set-Content -Path "artifacts/${{ matrix.target }}/build-info.txt"
          $lines | ForEach-Object { "- $_" } | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          if (Test-Path "artifacts/${{ matrix.target }}/capabilities.txt") {
            Get-Content "artifacts/${{ matrix.target }}/capabilities.txt" | ForEach-Object { "- $_" } | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      # Keep each target's DLLs, supported capabilities, and dependency record
      # together; do not publish a successful artifact when outputs are missing.
      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: xngine-${{ steps.mo2.outputs.artifact_suffix }}
          path: artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
